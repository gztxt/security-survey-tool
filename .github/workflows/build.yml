name: Build & Release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 必须先于 setup-node 安装：setup-node 的 cache: 'pnpm' 需要在缓存步骤执行前
      # 就能定位 pnpm 可执行文件（Run #1/#2 正是死在这里：Unable to locate executable file: pnpm）。
      # 版本不写死：action 会读 package.json 的 packageManager 字段（当前 pnpm@11.22.0）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Desktop App
        working-directory: apps/desktop
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-survey-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.zip
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: releases/**/*.exe
          generate_release_notes: true
